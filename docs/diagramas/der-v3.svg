="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="103.7" y="634.765" fill="#000" font-size="14" textLength="168.8">fecha_vencimiento : date</text><line x1="84.7" y1="641.718" x2="315.111" y2="641.718" style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;"/><text x="89.7" y="659.253" fill="#000" font-size="14" textLength="188.945">unique (id_credito, numero)</text></g><!--class cobranzas--><g class="entity" data-qualified-name="cobranzas" id="ent0004" data-source-line="39"><rect x="100.93" y="736.208" width="197.965" height="124.93" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="165.1" y="754.743" fill="#000" font-size="14" textLength="69.624">cobranzas</text><line x1="101.93" y1="762.697" x2="297.895" y2="762.697" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="111.93" cy="776.441" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="120.93" y="780.232" fill="#000" font-size="14" textLength="171.965">id : bigint «PK» «identity»</text><line x1="101.93" y1="787.185" x2="297.895" y2="787.185" style="stroke:#181818;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="111.93" cy="800.929" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="120.93" y="804.72" fill="#000" font-size="14" textLength="145.879">id_cuota : bigint «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="111.93" cy="817.417" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="120.93" y="821.208" fill="#000" font-size="14" textLength="161.868">importe : numeric(12,2)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="111.93" cy="833.906" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="120.93" y="837.697" fill="#000" font-size="14" textLength="148.894">fecha_cobranza : date</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="111.93" cy="850.394" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="120.93" y="854.185" fill="#000" font-size="14" textLength="120.996">anulada : boolean</text></g><!--class usuarios--><g class="entity" data-qualified-name="usuarios" id="ent0005" data-source-line="48"><rect x="348.28" y="44.488" width="295.247" height="141.418" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="467.025" y="63.023" fill="#000" font-size="14" textLength="57.757">usuarios</text><line x1="349.28" y1="70.977" x2="642.527" y2="70.977" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="359.28" cy="84.721" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="368.28" y="88.512" fill="#000" font-size="14" textLength="171.965">id : bigint «PK» «identity»</text><line x1="349.28" y1="95.465" x2="642.527" y2="95.465" style="stroke:#181818;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="359.28" cy="109.209" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="368.28" y="113" fill="#000" font-size="14" textLength="231.444">username : varchar(255) «unique»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="359.28" cy="125.697" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="368.28" y="129.488" fill="#000" font-size="14" textLength="264.325">password : varchar(255) «hash BCrypt»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="359.28" cy="142.186" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="368.28" y="145.977" fill="#000" font-size="14" textLength="269.247">rol : enum('ADMIN','SUPERVISOR','USER')</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="359.28" cy="158.674" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="368.28" y="162.465" fill="#000" font-size="14" textLength="213.486">puede_anular_credito : boolean</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="359.28" cy="175.162" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="368.28" y="178.953" fill="#000" font-size="14" textLength="228.58">puede_anular_cobranza : boolean</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="64"><path d="M452.42,315.728 L452.42,347.138 L392.99,351.138 L452.42,355.138 L452.42,386.97 A0,0 0 0 0 452.42,386.97 L875.392,386.97 A0,0 0 0 0 875.392,386.97 L875.392,325.728 L865.392,315.728 L452.42,315.728 A0,0 0 0 0 452.42,315.728" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M865.392,315.728 L865.392,325.728 L875.392,325.728 L865.392,315.728" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="458.42" y="333.297" fill="#000" font-size="13" textLength="401.972">No hay columna de estado: VIGENTE / CANCELADO / ANULADO</text><text x="458.42" y="348.607" fill="#000" font-size="13" textLength="340.438">lo calcula Credito.estado() a partir de anulado y de las</text><text x="458.42" y="363.918" fill="#000" font-size="13" textLength="383.17">cobranzas vigentes de sus cuotas. saldo tampoco se guarda.</text><text x="458.42" y="379.228" fill="#000" font-size="13" textLength="353.279">importe_cuota es la foto del importe con que se otorgó.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="71"><path d="M359.09,755.398 L359.09,795.138 L299.35,799.138 L359.09,803.138 L359.09,841.951 A0,0 0 0 0 359.09,841.951 L754.735,841.951 A0,0 0 0 0 754.735,841.951 L754.735,765.398 L744.735,755.398 L359.09,755.398 A0,0 0 0 0 359.09,755.398" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M744.735,755.398 L744.735,765.398 L754.735,765.398 L744.735,755.398" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="365.09" y="772.967" fill="#000" font-size="13" textLength="374.645">Regla que el esquema NO protege: a lo sumo una cobranza</text><text x="365.09" y="788.277" fill="#000" font-size="13" textLength="369.459">no anulada por cuota. La valida Cuota.registrarCobranza(),</text><text x="365.09" y="803.588" fill="#000" font-size="13" textLength="374.353">serializada con bloqueo pesimista de la cuota y del crédito.</text><text x="365.09" y="818.898" fill="#000" font-size="13" textLength="341.536">Tampoco protege: importes > 0, tasa >= 0, ni que no</text><text x="365.09" y="834.209" fill="#000" font-size="13" textLength="266.221">se cobre una cuota de un crédito anulado.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="79"><path d="M703.85,79.578 L703.85,111.138 L643.87,115.138 L703.85,119.138 L703.85,150.82 A0,0 0 0 0 703.85,150.82 L1051.957,150.82 A0,0 0 0 0 1051.957,150.82 L1051.957,89.578 L1041.957,79.578 L703.85,79.578 A0,0 0 0 0 703.85,79.578" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1041.957,79.578 L1041.957,89.578 L1051.957,89.578 L1041.957,79.578" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="709.85" y="97.147" fill="#000" font-size="13" textLength="322.461">Sin FK al resto: ninguna tabla guarda quién otorgó,</text><text x="709.85" y="112.457" fill="#000" font-size="13" textLength="198.732">cobró o anuló (H8 del backlog).</text><text x="709.85" y="127.768" fill="#000" font-size="13" textLength="327.107">Los permisos son un @Embeddable (Permisos) en la</text><text x="709.85" y="143.078" fill="#000" font-size="13" textLength="81.225">misma tabla.</text></g><g class="entity" data-qualified-name="general" id="ent0019" data-source-line="86"><path d="M1112.04,87.228 L1112.04,143.16 L1567.778,143.16 L1567.778,97.228 L1557.778,87.228 L1112.04,87.228" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1557.778,87.228 L1557.778,97.228 L1567.778,97.228 L1557.778,87.228" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1118.04" y="104.797" fill="#000" font-size="13" textLength="410.008">Todas las columnas son NOT NULL. Las FK no tienen ON DELETE:</text><text x="1118.04" y="120.107" fill="#000" font-size="13" textLength="382.154">no se borra nada, la anulación es lógica (anulado / anulada).</text><text x="1118.04" y="135.418" fill="#000" font-size="13" textLength="434.738">H2 crea un índice por cada FK y uno único para (id_credito, numero).</text></g><!--link clientes to usuarios--><!--link clientes to creditos--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="59" data-link-type="crowfoot"><path d="M199.91,161.398 C199.91,189.078 199.91,201.768 199.91,237.618" style="stroke:#181818;stroke-width:1;" fill="none" id="clientes-creditos" codeLine="59"/><line x1="195.91" y1="157.398" x2="203.91" y2="157.398" style="stroke:#181818;stroke-width:1;"/><line x1="195.91" y1="160.398" x2="203.91" y2="160.398" style="stroke:#181818;stroke-width:1;"/><line x1="199.91" y1="161.398" x2="199.91" y2="153.398" style="stroke:#181818;stroke-width:1;"/><line x1="199.91" y1="247.618" x2="205.91" y2="255.618" style="stroke:#181818;stroke-width:1;"/><line x1="199.91" y1="247.618" x2="193.91" y2="255.618" style="stroke:#181818;stroke-width:1;"/><line x1="199.91" y1="247.618" x2="199.91" y2="255.618" style="stroke:#181818;stroke-width:1;"/><ellipse cx="199.91" cy="241.618" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="116.538" y="186.077" fill="#000" font-size="13" textLength="68.098">dni_cliente</text><text x="101.91" y="201.387" fill="#000" font-size="13" textLength="97.354">0..N por cliente</text></g><!--link creditos to cuotas--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-source-line="60" data-link-type="crowfoot"><path d="M199.91,454.948 C199.91,478.108 199.91,476.528 199.91,498.568" style="stroke:#181818;stroke-width:1;" fill="none" id="creditos-cuotas" codeLine="60"/><line x1="195.91" y1="450.948" x2="203.91" y2="450.948" style="stroke:#181818;stroke-width:1;"/><line x1="195.91" y1="453