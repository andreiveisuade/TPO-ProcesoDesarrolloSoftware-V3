spring.application.name=tpejemplo

# Perfil por defecto: dev. Para prod: --spring.profiles.active=prod
spring.profiles.default=dev

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:tpdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Puerto
server.port=8080

# JWT
jwt.secret=${JWT_SECRET:clave-super-secreta-de-al-menos-32-caracteres-uade2026}
jwt.expiration-ms=86400000
